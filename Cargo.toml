[package]
name = "vu"
version = "0.1.0"
edition = "2021"
description = "Terminal sound level meter with timeline, spectrogram and graphic equalizer"
license = "MIT"

[[bin]]
name = "vu"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.15"
hound = "3.5"
ratatui = "0.29"
realfft = "3.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[[bench]]
name = "perf"
harness = false
